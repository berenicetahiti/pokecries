<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qui est ce Pokémon ? — Le jeu des cris</title>
  <style>
    :root {
      --red: #e3350d;
      --yellow: #ffcb05;
      --blue: #3d7dca;
      --dark: #1a1a2e;
      --card-bg: #16213e;
      --text: #eee;
      --muted: #8899aa;
      --green: #4caf50;
      --orange: #ff9800;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2rem;
      color: var(--yellow);
      text-shadow: 0 0 20px rgba(255, 203, 5, 0.4);
      letter-spacing: 1px;
    }

    header p {
      color: var(--muted);
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 2px solid #2a3a5c;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    /* Score bar */
    .score-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .score-bar span strong {
      color: var(--text);
    }

    /* Generation selector */
    .gen-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 1.5rem;
    }

    .gen-selector label {
      font-size: 0.8rem;
      color: var(--muted);
      width: 100%;
      margin-bottom: 0.2rem;
    }

    .gen-btn {
      background: #0f3460;
      border: 1px solid #2a3a5c;
      color: var(--muted);
      border-radius: 6px;
      padding: 0.25rem 0.6rem;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .gen-btn.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    /* Pokémon silhouette zone */
    .pokemon-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
      min-height: 160px;
      justify-content: center;
    }

    .pokemon-img-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
    }

    .pokemon-img-wrapper img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      filter: brightness(0) invert(0);
      transition: filter 0.5s;
    }

    .pokemon-img-wrapper img.hidden-sprite {
      filter: brightness(0);
    }

    .pokemon-img-wrapper img.revealed-sprite {
      filter: none;
    }

    .pokemon-number {
      font-size: 0.75rem;
      color: var(--muted);
    }

    /* Waveform animation */
    .waveform {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 32px;
    }

    .waveform .bar {
      width: 4px;
      background: var(--blue);
      border-radius: 2px;
      animation: none;
      height: 4px;
      transition: height 0.1s;
    }

    .waveform.playing .bar {
      animation: wave 0.8s ease-in-out infinite;
    }

    .waveform .bar:nth-child(2) { animation-delay: 0.1s; }
    .waveform .bar:nth-child(3) { animation-delay: 0.2s; }
    .waveform .bar:nth-child(4) { animation-delay: 0.3s; }
    .waveform .bar:nth-child(5) { animation-delay: 0.15s; }
    .waveform .bar:nth-child(6) { animation-delay: 0.25s; }
    .waveform .bar:nth-child(7) { animation-delay: 0.05s; }

    @keyframes wave {
      0%, 100% { height: 4px; }
      50% { height: 28px; }
    }

    /* Buttons */
    .btn-row {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.2rem;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.6rem 1.2rem;
      transition: opacity 0.2s, transform 0.1s;
    }

    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-play {
      background: var(--blue);
      color: #fff;
      flex: 1;
    }

    .btn-cry-type {
      background: #0f3460;
      border: 1px solid #2a3a5c;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0.6rem 0.8rem;
    }

    .btn-cry-type.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    /* Input zone */
    .input-zone {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1rem;
    }

    .input-zone input {
      flex: 1;
      background: #0f3460;
      border: 2px solid #2a3a5c;
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      padding: 0.6rem 0.8rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-zone input:focus {
      border-color: var(--blue);
    }

    .input-zone input::placeholder {
      color: var(--muted);
    }

    .btn-validate {
      background: var(--red);
      color: #fff;
      padding: 0.6rem 1rem;
    }

    /* Feedback */
    .feedback {
      min-height: 2.5rem;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.3s;
      background: transparent;
    }

    .feedback.correct {
      background: rgba(76, 175, 80, 0.15);
      border: 1px solid var(--green);
      color: var(--green);
    }

    .feedback.wrong {
      background: rgba(227, 53, 13, 0.15);
      border: 1px solid var(--red);
      color: #ff6b4a;
    }

    .feedback.skipped {
      background: rgba(255, 152, 0, 0.15);
      border: 1px solid var(--orange);
      color: var(--orange);
    }

    /* Skip / Next */
    .btn-row-bottom {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.8rem;
    }

    .btn-skip {
      background: transparent;
      border: 1px solid #2a3a5c;
      color: var(--muted);
      font-size: 0.85rem;
      flex: 1;
    }

    .btn-next {
      background: var(--yellow);
      color: #222;
      flex: 1;
    }

    .btn-next:disabled {
      background: #2a3a5c;
      color: var(--muted);
    }

    /* Autocomplete */
    .autocomplete-wrapper {
      position: relative;
    }

    .autocomplete-list {
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      background: #0f3460;
      border: 1px solid #2a3a5c;
      border-radius: 8px;
      max-height: 160px;
      overflow-y: auto;
      z-index: 100;
      margin-bottom: 4px;
    }

    .autocomplete-list li {
      list-style: none;
      padding: 0.5rem 0.8rem;
      cursor: pointer;
      font-size: 0.9rem;
      text-transform: capitalize;
    }

    .autocomplete-list li:hover,
    .autocomplete-list li.selected {
      background: var(--blue);
      color: #fff;
    }

    /* Loading spinner */
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #2a3a5c;
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    footer {
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: 0.75rem;
      text-align: center;
    }

    footer a { color: var(--blue); text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <h1>Qui est ce Pokémon ?</h1>
    <p>Écoute le cri et devine le Pokémon !</p>
  </header>

  <div class="card">
    <!-- Score -->
    <div class="score-bar">
      <span>Score : <strong id="score">0</strong></span>
      <span>Série : <strong id="streak">0</strong> 🔥</span>
      <span>Total : <strong id="total">0</strong></span>
    </div>

    <!-- Génération -->
    <div class="gen-selector">
      <label>Générations :</label>
      <button class="gen-btn active" data-start="1" data-end="151">Gen I</button>
      <button class="gen-btn active" data-start="152" data-end="251">Gen II</button>
      <button class="gen-btn active" data-start="252" data-end="386">Gen III</button>
      <button class="gen-btn active" data-start="387" data-end="493">Gen IV</button>
      <button class="gen-btn active" data-start="494" data-end="649">Gen V</button>
      <button class="gen-btn active" data-start="650" data-end="721">Gen VI</button>
      <button class="gen-btn active" data-start="722" data-end="809">Gen VII</button>
      <button class="gen-btn active" data-start="810" data-end="905">Gen VIII</button>
      <button class="gen-btn active" data-start="906" data-end="1025">Gen IX</button>
    </div>

    <!-- Zone Pokémon -->
    <div class="pokemon-zone">
      <div id="loading" class="spinner" style="display:none;"></div>
      <div class="pokemon-img-wrapper" id="img-wrapper" style="display:none;">
        <img id="pokemon-sprite" src="" alt="Pokémon" class="hidden-sprite" />
      </div>
      <div class="waveform" id="waveform">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>

    <!-- Contrôles audio -->
    <div class="btn-row">
      <button class="btn-play" id="btn-play" disabled>▶ Jouer le cri</button>
      <button class="btn-cry-type active" id="btn-latest" title="Cri moderne (Gen VI+)">Moderne</button>
      <button class="btn-cry-type" id="btn-legacy" title="Cri rétro (Gen I-V)">Rétro</button>
    </div>

    <!-- Saisie -->
    <div class="input-zone">
      <div class="autocomplete-wrapper" style="flex:1; position:relative;">
        <input
          type="text"
          id="guess-input"
          placeholder="Nom du Pokémon..."
          autocomplete="off"
          disabled
        />
        <ul class="autocomplete-list" id="autocomplete-list" style="display:none;"></ul>
      </div>
      <button class="btn-validate" id="btn-validate" disabled>OK</button>
    </div>

    <!-- Feedback -->
    <div class="feedback" id="feedback"></div>

    <!-- Actions bas -->
    <div class="btn-row-bottom">
      <button class="btn-skip" id="btn-skip" disabled>Passer</button>
      <button class="btn-next" id="btn-next" disabled>Pokémon suivant ›</button>
    </div>
  </div>

  <footer>
    Données : <a href="https://pokeapi.co" target="_blank">PokéAPI</a> · Cris : <a href="https://github.com/PokeAPI/cries" target="_blank">PokeAPI/cries</a>
  </footer>

  <audio id="cry-audio" preload="auto"></audio>

  <script>
    // ── State ─────────────────────────────────────────────────────────────
    const state = {
      allPokemon: [],        // [{id, name}] from selected gens
      currentPokemon: null,  // {id, name, cries, sprite}
      answered: false,
      score: 0,
      streak: 0,
      total: 0,
      cryType: 'latest',     // 'latest' | 'legacy'
      activeGens: new Set(), // filled from buttons
    };

    // ── DOM refs ──────────────────────────────────────────────────────────
    const $ = id => document.getElementById(id);
    const elScore    = $('score');
    const elStreak   = $('streak');
    const elTotal    = $('total');
    const elLoading  = $('loading');
    const elImgWrap  = $('img-wrapper');
    const elSprite   = $('pokemon-sprite');
    const elWaveform = $('waveform');
    const elBtnPlay  = $('btn-play');
    const elBtnLatest = $('btn-latest');
    const elBtnLegacy = $('btn-legacy');
    const elInput    = $('guess-input');
    const elValidate = $('btn-validate');
    const elFeedback = $('feedback');
    const elSkip     = $('btn-skip');
    const elNext     = $('btn-next');
    const elAcList   = $('autocomplete-list');
    const elAudio    = $('cry-audio');

    // ── Generations ───────────────────────────────────────────────────────
    const genBtns = document.querySelectorAll('.gen-btn');
    genBtns.forEach(btn => {
      state.activeGens.add(btn.dataset.start + '-' + btn.dataset.end);
      btn.addEventListener('click', () => {
        const key = btn.dataset.start + '-' + btn.dataset.end;
        if (state.activeGens.has(key)) {
          // Don't allow deselecting all
          if (state.activeGens.size === 1) return;
          state.activeGens.delete(key);
          btn.classList.remove('active');
        } else {
          state.activeGens.add(key);
          btn.classList.add('active');
        }
        buildPool();
      });
    });

    // ── Pokemon list cache (names only, no API needed) ────────────────────
    // We'll use the PokéAPI /pokemon?limit= endpoint to get all names+ids
    let fullList = []; // [{id, name}]

    async function loadFullList() {
      // PokéAPI allows up to 100000 limit — fetch all at once
      const res = await fetch('https://pokeapi.co/api/v2/pokemon?limit=1025&offset=0');
      const data = await res.json();
      fullList = data.results.map((p, i) => ({
        id: i + 1,
        name: p.name,
      }));
      buildPool();
      nextPokemon();
    }

    function buildPool() {
      state.allPokemon = [];
      for (const key of state.activeGens) {
        const [start, end] = key.split('-').map(Number);
        const slice = fullList.filter(p => p.id >= start && p.id <= end);
        state.allPokemon.push(...slice);
      }
    }

    // ── Load a random Pokémon ─────────────────────────────────────────────
    async function nextPokemon() {
      if (state.allPokemon.length === 0) return;

      setLoading(true);
      resetUI();

      const pick = state.allPokemon[Math.floor(Math.random() * state.allPokemon.length)];

      try {
        const res = await fetch(`https://pokeapi.co/api/v2/pokemon/${pick.id}`);
        const data = await res.json();

        state.currentPokemon = {
          id: data.id,
          name: data.name,
          cries: data.cries,
          sprite: data.sprites?.other?.['official-artwork']?.front_default
               || data.sprites?.front_default
               || null,
        };

        setLoading(false);
        showPokemon();
        playCry();
      } catch (e) {
        setLoading(false);
        elFeedback.textContent = 'Erreur de chargement, réessaie.';
      }
    }

    function showPokemon() {
      if (state.currentPokemon.sprite) {
        elSprite.src = state.currentPokemon.sprite;
        elSprite.className = 'hidden-sprite';
        elImgWrap.style.display = 'block';
      }
      elBtnPlay.disabled = false;
      elInput.disabled = false;
      elValidate.disabled = false;
      elSkip.disabled = false;
    }

    // ── Audio ─────────────────────────────────────────────────────────────
    function getCryUrl() {
      const p = state.currentPokemon;
      if (!p) return null;
      return state.cryType === 'latest' ? p.cries.latest : (p.cries.legacy || p.cries.latest);
    }

    function playCry() {
      const url = getCryUrl();
      if (!url) return;
      elAudio.src = url;
      elAudio.load();
      elAudio.play().catch(() => {});
    }

    elAudio.addEventListener('play', () => elWaveform.classList.add('playing'));
    elAudio.addEventListener('ended', () => elWaveform.classList.remove('playing'));
    elAudio.addEventListener('pause', () => elWaveform.classList.remove('playing'));

    elBtnPlay.addEventListener('click', playCry);

    elBtnLatest.addEventListener('click', () => {
      state.cryType = 'latest';
      elBtnLatest.classList.add('active');
      elBtnLegacy.classList.remove('active');
      if (!state.answered) playCry();
    });

    elBtnLegacy.addEventListener('click', () => {
      state.cryType = 'legacy';
      elBtnLegacy.classList.add('active');
      elBtnLatest.classList.remove('active');
      if (!state.answered) playCry();
    });

    // ── Autocomplete ──────────────────────────────────────────────────────
    let acIndex = -1;

    elInput.addEventListener('input', () => {
      const val = elInput.value.trim().toLowerCase();
      if (val.length < 2) { hideAc(); return; }

      const matches = fullList
        .filter(p => p.name.includes(val))
        .slice(0, 8);

      if (matches.length === 0) { hideAc(); return; }

      elAcList.innerHTML = '';
      acIndex = -1;
      matches.forEach((p, i) => {
        const li = document.createElement('li');
        li.textContent = capitalize(p.name);
        li.dataset.name = p.name;
        li.addEventListener('mousedown', e => {
          e.preventDefault();
          elInput.value = capitalize(p.name);
          hideAc();
          validate();
        });
        elAcList.appendChild(li);
      });
      elAcList.style.display = 'block';
    });

    elInput.addEventListener('keydown', e => {
      const items = elAcList.querySelectorAll('li');
      if (e.key === 'ArrowDown') {
        acIndex = Math.min(acIndex + 1, items.length - 1);
        updateAcHighlight(items);
        e.preventDefault();
      } else if (e.key === 'ArrowUp') {
        acIndex = Math.max(acIndex - 1, -1);
        updateAcHighlight(items);
        e.preventDefault();
      } else if (e.key === 'Enter') {
        if (acIndex >= 0 && items[acIndex]) {
          elInput.value = items[acIndex].dataset.name.split('-').map(capitalize).join(' ');
          hideAc();
        }
        validate();
      }
    });

    elInput.addEventListener('blur', () => setTimeout(hideAc, 150));

    function updateAcHighlight(items) {
      items.forEach((li, i) => li.classList.toggle('selected', i === acIndex));
      if (acIndex >= 0 && items[acIndex]) items[acIndex].scrollIntoView({ block: 'nearest' });
    }

    function hideAc() {
      elAcList.style.display = 'none';
      acIndex = -1;
    }

    // ── Validation ────────────────────────────────────────────────────────
    elValidate.addEventListener('click', validate);

    function normalize(str) {
      return str
        .toLowerCase()
        .trim()
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '') // strip accents
        .replace(/[^a-z0-9]/g, '');      // keep only alphanumeric
    }

    function validate() {
      if (state.answered || !state.currentPokemon) return;
      hideAc();

      const guess = elInput.value;
      const correct = state.currentPokemon.name;

      if (!guess.trim()) return;

      // Accept partial match on normalized name
      const normGuess = normalize(guess);
      const normCorrect = normalize(correct);

      // Also build display name without form suffix (e.g. "pikachu-original" → "pikachu")
      const baseName = correct.split('-')[0];
      const normBase = normalize(baseName);

      const isCorrect = normGuess === normCorrect || normGuess === normBase;

      state.answered = true;
      state.total++;

      if (isCorrect) {
        state.score++;
        state.streak++;
        showFeedback('correct', `Bravo ! C'était bien ${capitalize(correct)} !`);
      } else {
        state.streak = 0;
        showFeedback('wrong', `Raté ! C'était ${capitalize(correct)}.`);
      }

      updateScore();
      revealSprite();
      elInput.disabled = true;
      elValidate.disabled = true;
      elSkip.disabled = true;
      elNext.disabled = false;
    }

    elSkip.addEventListener('click', () => {
      if (state.answered || !state.currentPokemon) return;
      state.answered = true;
      state.total++;
      state.streak = 0;
      updateScore();
      revealSprite();
      showFeedback('skipped', `C'était ${capitalize(state.currentPokemon.name)}.`);
      elInput.disabled = true;
      elValidate.disabled = true;
      elSkip.disabled = true;
      elNext.disabled = false;
    });

    elNext.addEventListener('click', nextPokemon);

    // ── Helpers ───────────────────────────────────────────────────────────
    function setLoading(on) {
      elLoading.style.display = on ? 'block' : 'none';
      elImgWrap.style.display = on ? 'none' : (state.currentPokemon?.sprite ? 'block' : 'none');
    }

    function resetUI() {
      state.answered = false;
      elFeedback.className = 'feedback';
      elFeedback.textContent = '';
      elInput.value = '';
      elInput.disabled = true;
      elValidate.disabled = true;
      elSkip.disabled = true;
      elNext.disabled = true;
      elBtnPlay.disabled = true;
      elSprite.className = 'hidden-sprite';
      hideAc();
    }

    function revealSprite() {
      elSprite.className = 'revealed-sprite';
    }

    function showFeedback(type, msg) {
      elFeedback.className = 'feedback ' + type;
      elFeedback.textContent = msg;
    }

    function updateScore() {
      elScore.textContent = state.score;
      elStreak.textContent = state.streak;
      elTotal.textContent = state.total;
    }

    function capitalize(str) {
      return str.charAt(0).toUpperCase() + str.slice(1);
    }

    // ── Boot ──────────────────────────────────────────────────────────────
    setLoading(true);
    loadFullList();
  </script>
</body>
</html>
