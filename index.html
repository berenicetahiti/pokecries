<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Qui est ce Pokémon ? — Le jeu des cris</title>
  <style>
    :root {
      --red: #e3350d;
      --yellow: #ffcb05;
      --blue: #3d7dca;
      --dark: #1a1a2e;
      --card-bg: #16213e;
      --text: #eee;
      --muted: #8899aa;
      --green: #4caf50;
      --orange: #ff9800;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    header {
      text-align: center;
      margin-bottom: 2rem;
    }

    header h1 {
      font-size: 2rem;
      color: var(--yellow);
      text-shadow: 0 0 20px rgba(255, 203, 5, 0.4);
      letter-spacing: 1px;
    }

    header p {
      color: var(--muted);
      margin-top: 0.4rem;
      font-size: 0.95rem;
    }

    .card {
      background: var(--card-bg);
      border: 2px solid #2a3a5c;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    .score-bar {
      display: flex;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .score-bar span strong { color: var(--text); }

    .section-label {
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .filter-section { margin-bottom: 1rem; }

    .filter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .gen-btn {
      background: #0f3460;
      border: 1px solid #2a3a5c;
      color: var(--muted);
      border-radius: 6px;
      padding: 0.22rem 0.55rem;
      cursor: pointer;
      font-size: 0.78rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .gen-btn.active {
      background: var(--blue);
      border-color: var(--blue);
      color: #fff;
    }

    .type-btn {
      border: 2px solid transparent;
      border-radius: 20px;
      padding: 0.2rem 0.65rem;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
      opacity: 0.35;
      transition: opacity 0.2s, transform 0.1s;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }
    .type-btn.active { opacity: 1; }
    .type-btn:active { transform: scale(0.95); }

    .pokemon-zone {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      margin-bottom: 1.2rem;
      min-height: 150px;
      justify-content: center;
    }

    .pokemon-img-wrapper {
      position: relative;
      width: 120px;
      height: 120px;
    }

    .pokemon-img-wrapper img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      transition: filter 0.5s;
    }

    .pokemon-img-wrapper img.hidden-sprite  { filter: brightness(0); }
    .pokemon-img-wrapper img.visible-sprite { filter: none; }
    .pokemon-img-wrapper img.revealed-sprite { filter: none; }

    .sprite-mode-btn {
      background: #0f3460;
      border: 1px solid #2a3a5c;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.25rem 0.7rem;
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .sprite-mode-btn:hover { border-color: var(--blue); color: var(--text); }

    .waveform {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 28px;
    }

    .waveform .bar {
      width: 4px;
      background: var(--blue);
      border-radius: 2px;
      height: 4px;
    }

    .waveform.playing .bar { animation: wave 0.8s ease-in-out infinite; }
    .waveform .bar:nth-child(2) { animation-delay: 0.1s; }
    .waveform .bar:nth-child(3) { animation-delay: 0.2s; }
    .waveform .bar:nth-child(4) { animation-delay: 0.3s; }
    .waveform .bar:nth-child(5) { animation-delay: 0.15s; }
    .waveform .bar:nth-child(6) { animation-delay: 0.25s; }
    .waveform .bar:nth-child(7) { animation-delay: 0.05s; }

    @keyframes wave {
      0%, 100% { height: 4px; }
      50%       { height: 24px; }
    }

    .btn-row {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.2rem;
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 0.6rem 1.2rem;
      transition: opacity 0.2s, transform 0.1s;
    }
    button:active  { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-play { background: var(--blue); color: #fff; flex: 1; }

    .btn-cry-type {
      background: #0f3460;
      border: 1px solid #2a3a5c;
      color: var(--muted);
      font-size: 0.8rem;
      padding: 0.6rem 0.8rem;
    }
    .btn-cry-type.active { background: var(--blue); border-color: var(--blue); color: #fff; }

    .input-zone { display: flex; gap: 0.6rem; margin-bottom: 1rem; }

    .input-zone input {
      flex: 1;
      background: #0f3460;
      border: 2px solid #2a3a5c;
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      padding: 0.6rem 0.8rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-zone input:focus    { border-color: var(--blue); }
    .input-zone input::placeholder { color: var(--muted); }

    .btn-validate { background: var(--red); color: #fff; padding: 0.6rem 1rem; }

    .feedback {
      min-height: 2.5rem;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      transition: all 0.3s;
      background: transparent;
    }
    .feedback.correct { background: rgba(76,175,80,.15); border: 1px solid var(--green);  color: var(--green); }
    .feedback.wrong   { background: rgba(227,53,13,.15); border: 1px solid var(--red);    color: #ff6b4a; }
    .feedback.skipped { background: rgba(255,152,0,.15); border: 1px solid var(--orange); color: var(--orange); }

    .btn-row-bottom { display: flex; gap: 0.6rem; margin-top: 0.8rem; }

    .btn-skip {
      background: transparent;
      border: 1px solid #2a3a5c;
      color: var(--muted);
      font-size: 0.85rem;
      flex: 1;
    }

    .btn-next { background: var(--yellow); color: #222; flex: 1; }
    .btn-next:disabled { background: #2a3a5c; color: var(--muted); }

    .autocomplete-wrapper { position: relative; flex: 1; }

    .autocomplete-list {
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      background: #0f3460;
      border: 1px solid #2a3a5c;
      border-radius: 8px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 100;
      margin-bottom: 4px;
    }

    .autocomplete-list li {
      list-style: none;
      padding: 0.35rem 0.7rem;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .autocomplete-list li:hover,
    .autocomplete-list li.selected { background: var(--blue); color: #fff; }

    .ac-icon {
      width: 36px;
      height: 36px;
      object-fit: contain;
      image-rendering: pixelated;
      flex-shrink: 0;
    }

    .ac-name { text-transform: capitalize; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #2a3a5c;
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    footer { margin-top: 1.5rem; color: var(--muted); font-size: 0.75rem; text-align: center; }
    footer a { color: var(--blue); text-decoration: none; }

    .divider { border: none; border-top: 1px solid #2a3a5c; margin: 0.8rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>Qui est ce Pokémon ?</h1>
    <p>Écoute le cri et devine le Pokémon !</p>
  </header>

  <div class="card">
    <div class="score-bar">
      <span>Score : <strong id="score">0</strong></span>
      <span>Série : <strong id="streak">0</strong> 🔥</span>
      <span>Total : <strong id="total">0</strong></span>
    </div>

    <hr class="divider" />

    <div class="filter-section">
      <div class="section-label">Générations :</div>
      <div class="filter-row" id="gen-filter">
        <button class="gen-btn active" data-start="1"   data-end="151">Gen I</button>
        <button class="gen-btn active" data-start="152" data-end="251">Gen II</button>
        <button class="gen-btn active" data-start="252" data-end="386">Gen III</button>
        <button class="gen-btn active" data-start="387" data-end="493">Gen IV</button>
        <button class="gen-btn active" data-start="494" data-end="649">Gen V</button>
        <button class="gen-btn active" data-start="650" data-end="721">Gen VI</button>
        <button class="gen-btn active" data-start="722" data-end="809">Gen VII</button>
        <button class="gen-btn active" data-start="810" data-end="905">Gen VIII</button>
        <button class="gen-btn active" data-start="906" data-end="1025">Gen IX</button>
      </div>
    </div>

    <div class="filter-section">
      <div class="section-label">Types <span style="color:#555;font-size:0.75rem;">(aucun = tous)</span> :</div>
      <div class="filter-row" id="type-filter"></div>
    </div>

    <hr class="divider" />

    <div class="pokemon-zone">
      <div id="loading" class="spinner" style="display:none;"></div>
      <div class="pokemon-img-wrapper" id="img-wrapper" style="display:none;">
        <img id="pokemon-sprite" src="" alt="Pokémon" class="hidden-sprite" />
      </div>
      <div class="waveform" id="waveform">
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div><div class="bar"></div><div class="bar"></div>
        <div class="bar"></div>
      </div>
      <button class="sprite-mode-btn" id="sprite-mode-btn">Ombre 🌑</button>
    </div>

    <div class="btn-row">
      <button class="btn-play" id="btn-play" disabled>▶ Jouer le cri</button>
      <button class="btn-cry-type active" id="btn-latest">Moderne</button>
      <button class="btn-cry-type"        id="btn-legacy">Rétro</button>
    </div>

    <div class="input-zone">
      <div class="autocomplete-wrapper">
        <input type="text" id="guess-input" placeholder="Nom du Pokémon (FR ou EN)..." autocomplete="off" disabled />
        <ul class="autocomplete-list" id="autocomplete-list" style="display:none;"></ul>
      </div>
      <button class="btn-validate" id="btn-validate" disabled>OK</button>
    </div>

    <div class="feedback" id="feedback"></div>

    <div class="btn-row-bottom">
      <button class="btn-skip" id="btn-skip" disabled>Passer</button>
      <button class="btn-next" id="btn-next" disabled>Pokémon suivant ›</button>
    </div>
  </div>

  <footer>
    Données : <a href="https://pokeapi.co" target="_blank">PokéAPI</a> ·
    Cris : <a href="https://github.com/PokeAPI/cries" target="_blank">PokeAPI/cries</a>
  </footer>

  <audio id="cry-audio" preload="auto"></audio>

  <script>
    const TYPE_INFO = [
      { id:  1, fr: 'Normal',   color: '#9199A1' },
      { id:  2, fr: 'Combat',   color: '#CE4069' },
      { id:  3, fr: 'Vol',      color: '#8FA8DD' },
      { id:  4, fr: 'Poison',   color: '#AB6AC8' },
      { id:  5, fr: 'Sol',      color: '#D97746' },
      { id:  6, fr: 'Roche',    color: '#C7B78B' },
      { id:  7, fr: 'Insecte',  color: '#90C12C' },
      { id:  8, fr: 'Spectre',  color: '#5269AC' },
      { id:  9, fr: 'Acier',    color: '#5A8EA1' },
      { id: 10, fr: 'Feu',      color: '#FF9C54' },
      { id: 11, fr: 'Eau',      color: '#4D90D5' },
      { id: 12, fr: 'Plante',   color: '#63BB5B' },
      { id: 13, fr: 'Électrik', color: '#F3D23B' },
      { id: 14, fr: 'Psy',      color: '#F97176' },
      { id: 15, fr: 'Glace',    color: '#74CEC0' },
      { id: 16, fr: 'Dragon',   color: '#0A6DC4' },
      { id: 17, fr: 'Ténèbres', color: '#5A5366' },
      { id: 18, fr: 'Fée',      color: '#EC8FE6' },
    ];

    const SPRITE_MODES  = ['shadow', 'visible', 'hidden'];
    const SPRITE_LABELS = { shadow: 'Ombre 🌑', visible: 'Visible 👁️', hidden: 'Caché ✖️' };

    const state = {
      filteredPool: [],
      deck: [],
      currentPokemon: null,
      currentFrName: null,
      answered: false,
      score: 0,
      streak: 0,
      total: 0,
      cryType: 'latest',
      spriteMode: 'shadow',
      activeGens: new Set(),
      activeTypes: new Set(),
      pokemonTypeMap: new Map(),
      typesLoaded: false,
    };

    const $ = id => document.getElementById(id);
    const elScore         = $('score');
    const elStreak        = $('streak');
    const elTotal         = $('total');
    const elLoading       = $('loading');
    const elImgWrap       = $('img-wrapper');
    const elSprite        = $('pokemon-sprite');
    const elWaveform      = $('waveform');
    const elBtnPlay       = $('btn-play');
    const elBtnLatest     = $('btn-latest');
    const elBtnLegacy     = $('btn-legacy');
    const elInput         = $('guess-input');
    const elValidate      = $('btn-validate');
    const elFeedback      = $('feedback');
    const elSkip          = $('btn-skip');
    const elNext          = $('btn-next');
    const elAcList        = $('autocomplete-list');
    const elAudio         = $('cry-audio');
    const elSpriteModeBtn = $('sprite-mode-btn');
    const elTypeFilter    = $('type-filter');

    elSpriteModeBtn.addEventListener('click', () => {
      const idx = SPRITE_MODES.indexOf(state.spriteMode);
      state.spriteMode = SPRITE_MODES[(idx + 1) % SPRITE_MODES.length];
      elSpriteModeBtn.textContent = SPRITE_LABELS[state.spriteMode];
      if (!state.answered && state.currentPokemon) applySpriteMode();
    });

    function applySpriteMode() {
      if (!state.currentPokemon?.sprite) return;
      if (state.spriteMode === 'hidden') {
        elImgWrap.style.display = 'none';
      } else {
        elImgWrap.style.display = 'block';
        elSprite.className = state.spriteMode === 'shadow' ? 'hidden-sprite' : 'visible-sprite';
      }
    }

    document.querySelectorAll('.gen-btn').forEach(btn => {
      state.activeGens.add(btn.dataset.start + '-' + btn.dataset.end);
      btn.addEventListener('click', () => {
        const key = btn.dataset.start + '-' + btn.dataset.end;
        if (state.activeGens.has(key)) {
          if (state.activeGens.size === 1) return;
          state.activeGens.delete(key);
          btn.classList.remove('active');
        } else {
          state.activeGens.add(key);
          btn.classList.add('active');
        }
        buildPool();
      });
    });

    function buildTypeUI() {
      TYPE_INFO.forEach(t => {
        const btn = document.createElement('button');
        btn.className = 'type-btn';
        btn.textContent = t.fr;
        btn.style.background = t.color;
        btn.dataset.typeId = t.id;
        btn.addEventListener('click', () => {
          if (state.activeTypes.has(t.id)) {
            state.activeTypes.delete(t.id);
            btn.classList.remove('active');
          } else {
            state.activeTypes.add(t.id);
            btn.classList.add('active');
          }
          buildPool();
        });
        elTypeFilter.appendChild(btn);
      });
    }

    let fullList = [];

    async function loadFullList() {
      const res = await fetch('https://pokeapi.co/api/v2/pokemon?limit=1025&offset=0');
      const data = await res.json();
      fullList = data.results.map((p, i) => ({ id: i + 1, name: p.name }));
      buildPool();
      nextPokemon();
    }

    async function loadTypeMap() {
      try {
        const results = await Promise.all(
          TYPE_INFO.map(t => fetch(`https://pokeapi.co/api/v2/type/${t.id}`).then(r => r.json()))
        );
        results.forEach((data, idx) => {
          const typeId = TYPE_INFO[idx].id;
          data.pokemon.forEach(entry => {
            const parts = entry.pokemon.url.split('/').filter(Boolean);
            const pokeId = parseInt(parts[parts.length - 1], 10);
            if (!state.pokemonTypeMap.has(pokeId)) state.pokemonTypeMap.set(pokeId, []);
            state.pokemonTypeMap.get(pokeId).push(typeId);
          });
        });
        state.typesLoaded = true;
        buildPool();
      } catch (e) {}
    }

    function buildPool() {
      let pool = [];
      for (const key of state.activeGens) {
        const [start, end] = key.split('-').map(Number);
        pool.push(...fullList.filter(p => p.id >= start && p.id <= end));
      }
      if (state.typesLoaded && state.activeTypes.size > 0) {
        pool = pool.filter(p => {
          const types = state.pokemonTypeMap.get(p.id) || [];
          return types.some(tid => state.activeTypes.has(tid));
        });
      }
      state.filteredPool = pool;
      state.deck = [];
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    async function nextPokemon() {
      const pool = state.filteredPool.length > 0 ? state.filteredPool : fullList;
      if (pool.length === 0) return;

      if (state.deck.length === 0) state.deck = shuffle(pool);
      const pick = state.deck.pop();

      setLoading(true);
      resetUI();
      try {
        const [pokeRes, speciesRes] = await Promise.all([
          fetch(`https://pokeapi.co/api/v2/pokemon/${pick.id}`),
          fetch(`https://pokeapi.co/api/v2/pokemon-species/${pick.id}`),
        ]);
        const data    = await pokeRes.json();
        const species = await speciesRes.json();
        state.currentPokemon = {
          id: data.id,
          name: data.name,
          cries: data.cries,
          sprite: data.sprites?.other?.['official-artwork']?.front_default
               || data.sprites?.front_default || null,
        };
        state.currentFrName = species.names?.find(n => n.language.name === 'fr')?.name || null;
        setLoading(false);
        showPokemon();
        playCry();
      } catch (e) {
        setLoading(false);
        showFeedback('wrong', 'Erreur de chargement, réessaie.');
      }
    }

    function showPokemon() {
      if (state.currentPokemon.sprite) {
        elSprite.src = state.currentPokemon.sprite;
        applySpriteMode();
      }
      elBtnPlay.disabled = false;
      elInput.disabled = false;
      elValidate.disabled = false;
      elSkip.disabled = false;
      elInput.focus();
    }

    function getCryUrl() {
      const p = state.currentPokemon;
      if (!p) return null;
      return state.cryType === 'latest' ? p.cries.latest : (p.cries.legacy || p.cries.latest);
    }

    function playCry() {
      const url = getCryUrl();
      if (!url) return;
      elAudio.src = url;
      elAudio.load();
      elAudio.play().catch(() => {});
    }

    elAudio.addEventListener('play',  () => elWaveform.classList.add('playing'));
    elAudio.addEventListener('ended', () => elWaveform.classList.remove('playing'));
    elAudio.addEventListener('pause', () => elWaveform.classList.remove('playing'));
    elBtnPlay.addEventListener('click', playCry);

    elBtnLatest.addEventListener('click', () => {
      state.cryType = 'latest';
      elBtnLatest.classList.add('active');
      elBtnLegacy.classList.remove('active');
      if (!state.answered) playCry();
    });

    elBtnLegacy.addEventListener('click', () => {
      state.cryType = 'legacy';
      elBtnLegacy.classList.add('active');
      elBtnLatest.classList.remove('active');
      if (!state.answered) playCry();
    });

    let acIndex = -1;

    elInput.addEventListener('input', () => {
      const val = elInput.value.trim().toLowerCase();
      if (val.length < 2) { hideAc(); return; }
      const matches = fullList.filter(p => p.name.includes(val)).slice(0, 8);
      if (matches.length === 0) { hideAc(); return; }
      elAcList.innerHTML = '';
      acIndex = -1;
      matches.forEach(p => {
        const li = document.createElement('li');
        li.dataset.name = p.name;
        const img = document.createElement('img');
        img.className = 'ac-icon';
        img.src = `https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${p.id}.png`;
        img.alt = '';
        const span = document.createElement('span');
        span.className = 'ac-name';
        span.textContent = capitalize(p.name);
        li.appendChild(img);
        li.appendChild(span);
        li.addEventListener('mousedown', e => {
          e.preventDefault();
          elInput.value = capitalize(p.name);
          hideAc();
          validate();
        });
        elAcList.appendChild(li);
      });
      elAcList.style.display = 'block';
    });

    elInput.addEventListener('keydown', e => {
      const items = elAcList.querySelectorAll('li');
      if (e.key === 'ArrowDown') {
        acIndex = Math.min(acIndex + 1, items.length - 1);
        updateAcHighlight(items); e.preventDefault();
      } else if (e.key === 'ArrowUp') {
        acIndex = Math.max(acIndex - 1, -1);
        updateAcHighlight(items); e.preventDefault();
      } else if (e.key === 'Enter') {
        e.stopPropagation();
        if (acIndex >= 0 && items[acIndex]) { elInput.value = items[acIndex].dataset.name; hideAc(); }
        validate();
      }
    });

    elInput.addEventListener('blur', () => setTimeout(hideAc, 150));

    function updateAcHighlight(items) {
      items.forEach((li, i) => li.classList.toggle('selected', i === acIndex));
      if (acIndex >= 0 && items[acIndex]) items[acIndex].scrollIntoView({ block: 'nearest' });
    }

    function hideAc() { elAcList.style.display = 'none'; acIndex = -1; }

    elValidate.addEventListener('click', validate);

    function normalize(str) {
      return str.toLowerCase().trim()
        .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z0-9]/g, '');
    }

    function pokemonLabel() {
      const en = capitalize(state.currentPokemon.name);
      const fr = state.currentFrName;
      return fr && normalize(fr) !== normalize(en) ? `${fr} (${en})` : en;
    }

    function validate() {
      if (state.answered || !state.currentPokemon) return;
      hideAc();
      const guess = elInput.value;
      if (!guess.trim()) return;
      const correct  = state.currentPokemon.name;
      const baseName = correct.split('-')[0];
      const normGuess = normalize(guess);
      const isCorrect =
        normGuess === normalize(correct) ||
        normGuess === normalize(baseName) ||
        (state.currentFrName && normGuess === normalize(state.currentFrName));
      state.answered = true;
      state.total++;
      if (isCorrect) {
        state.score++; state.streak++;
        showFeedback('correct', `Bravo ! C'était bien ${pokemonLabel()} !`);
      } else {
        state.streak = 0;
        showFeedback('wrong', `Raté ! C'était ${pokemonLabel()}.`);
      }
      updateScore();
      revealSprite();
      lockInputs();
    }

    elSkip.addEventListener('click', () => {
      if (state.answered || !state.currentPokemon) return;
      state.answered = true; state.total++; state.streak = 0;
      updateScore(); revealSprite();
      showFeedback('skipped', `C'était ${pokemonLabel()}.`);
      lockInputs();
    });

    elNext.addEventListener('click', nextPokemon);

    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      if (state.answered && !elNext.disabled) nextPokemon();
    });

    function lockInputs() {
      elInput.disabled = true; elValidate.disabled = true;
      elSkip.disabled = true; elNext.disabled = false;
    }

    function setLoading(on) {
      elLoading.style.display = on ? 'block' : 'none';
      if (on) elImgWrap.style.display = 'none';
    }

    function resetUI() {
      state.answered = false;
      state.currentFrName = null;
      elFeedback.className = 'feedback'; elFeedback.textContent = '';
      elInput.value = ''; elInput.disabled = true;
      elValidate.disabled = true; elSkip.disabled = true;
      elNext.disabled = true; elBtnPlay.disabled = true;
      elImgWrap.style.display = 'none';
      elSprite.className = 'hidden-sprite';
      hideAc();
    }

    function revealSprite() {
      elImgWrap.style.display = 'block';
      elSprite.className = 'revealed-sprite';
    }

    function showFeedback(type, msg) {
      elFeedback.className = 'feedback ' + type;
      elFeedback.textContent = msg;
    }

    function updateScore() {
      elScore.textContent  = state.score;
      elStreak.textContent = state.streak;
      elTotal.textContent  = state.total;
    }

    function capitalize(str) { return str.charAt(0).toUpperCase() + str.slice(1); }

    buildTypeUI();
    setLoading(true);
    Promise.all([loadFullList(), loadTypeMap()]);
  </script>
</body>
</html>
